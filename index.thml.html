<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фитнес Бот — Эмулятор v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone{width:375px;height:780px;background:#fff;border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;border:8px solid #222;position:relative}
.tg-header{background:#2aabee;padding:12px 16px;display:flex;align-items:center;gap:10px;color:#fff;flex-shrink:0}
.bot-avatar{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.bot-info h3{font-size:15px;font-weight:600}.bot-info span{font-size:12px;opacity:.85}
.chat{flex:1;overflow-y:auto;padding:10px 10px 6px;background:#e5ddd5;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}.chat::-webkit-scrollbar-thumb{background:#bbb;border-radius:4px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.msg.user{background:#dcf8c6;align-self:flex-end;border-bottom-right-radius:4px}
.inline-kb{align-self:flex-start;display:flex;flex-direction:column;gap:5px;width:80%}
.inline-row{display:flex;gap:5px}
.inline-btn{background:#fff;border:1px solid #2aabee;color:#2aabee;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;text-align:center;transition:background .15s,color .15s;user-select:none;flex:1}
.inline-btn:hover{background:#2aabee;color:#fff}.inline-btn:active{transform:scale(.97)}
.reply-kb{background:#d0ccc8;padding:6px;display:none;flex-wrap:wrap;gap:5px;flex-shrink:0}
.reply-btn{flex:1 1 calc(50% - 5px);background:#fff;border:none;border-radius:8px;padding:9px 6px;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:background .12s;user-select:none}
.reply-btn:hover{background:#f0f0f0}.reply-btn:active{background:#e0e0e0}
.typing{display:flex;gap:4px;padding:10px 12px;background:#fff;border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.1);width:fit-content}
.dot{width:7px;height:7px;background:#bbb;border-radius:50%;animation:bounce 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.input-area{display:flex;padding:8px;background:#f0f0f0;gap:6px;align-items:center;flex-shrink:0}
.msg-input{flex:1;border:1px solid #ddd;border-radius:22px;padding:9px 14px;font-size:14px;outline:none;background:#fff}
.send-btn{width:38px;height:38px;background:#2aabee;border:none;border-radius:50%;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:hover{background:#1a9bd8}
.timer-wrap{align-self:flex-start;background:#fff;border-radius:16px;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:12px 16px;text-align:center;animation:fadeIn .2s ease;width:80%}
.timer-display{font-size:32px;font-weight:700;color:#2aabee;font-variant-numeric:tabular-nums;margin:6px 0}
.timer-label{font-size:12px;color:#888}
.timer-bar{width:100%;height:6px;background:#eee;border-radius:3px;margin:8px 0;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#2aabee,#1a9bd8);border-radius:3px;transition:width .3s linear}
.timer-btns{display:flex;gap:6px;margin-top:6px}
.timer-btns button{flex:1;padding:7px;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.timer-btns .t-stop{background:#ff5555;color:#fff}
.timer-btns .t-add{background:#f39c12;color:#fff}
.timer-btns .t-restart{background:#2aabee;color:#fff}
.chart-wrap{align-self:flex-start;background:#fff;border-radius:16px;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:10px;width:85%;animation:fadeIn .2s ease}
.chart-wrap canvas{width:100%;height:160px}


/* ====== Calendar v2 (more readable) ====== */
.cal2-wrap{width:100%;max-width:340px}
.cal2-header{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.cal2-title{flex:1;text-align:center;font-weight:700;color:#2d3436;font-size:15px}
.cal2-nav{width:34px;height:34px;border-radius:10px;border:1px solid #dfe6e9;background:#fff;cursor:pointer;color:#2d3436;font-size:18px;line-height:1}
.cal2-nav:hover{background:#f7f7f7}
.cal2-nav:active{transform:scale(.98)}
.cal2-grid{display:grid;grid-template-columns:38px repeat(7,1fr);gap:6px 6px;align-items:center}
.cal2-h{font-size:11px;font-weight:700;text-align:center;color:#7f8c8d;letter-spacing:.2px}
.cal2-h.cal2-weekend{color:#c0392b}
.cal2-weeknum{font-size:12px;font-weight:800;text-align:center;color:#16a085}
.cal2-cell{display:flex;justify-content:center}
.cal2-daybtn{width:32px;height:32px;border-radius:12px;border:1px solid transparent;background:#f2f3f5;color:#2d3436;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.cal2-daybtn:hover{filter:brightness(.98)}
.cal2-daybtn:active{transform:scale(.98)}
.cal2-daybtn--weekend{color:#c0392b;background:#fff1f1}
.cal2-daybtn--workout{background:#d8f3f1;border-color:#20b2aa;color:#0b5e73}
.cal2-daybtn--manual{background:#fff3cd;border-color:#f39c12;color:#8a5a00}
.cal2-daybtn--today{background:#2563eb;border-color:#2563eb;color:#fff}
.cal2-daybtn--empty{background:transparent;border-color:transparent;cursor:default}
.cal2-note{margin-top:10px;font-size:12px;color:#636e72;line-height:1.35}
.cal2-legend{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-top:8px}
.cal2-pill{display:inline-flex;align-items:center;gap:6px}
.cal2-dot{width:10px;height:10px;border-radius:50%}
.cal2-dot--workout{background:#20b2aa}
.cal2-dot--manual{background:#f39c12}
.cal2-dot--today{background:#2563eb}
.cal2-dot--weekend{background:#c0392b}
.cal2-count{margin-top:6px;font-weight:700;color:#2d3436}
.cal2-details{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f7f7f7;color:#2d3436;font-size:12px;line-height:1.35;white-space:pre-wrap}



/* Calendar bubble: make it wider so the calendar fits nicely */
.msg.bot.cal2-bubble{max-width:96%; width:96%;}
@media (max-width:420px){
  .msg.bot.cal2-bubble{max-width:98%; width:98%;}
}
/* Slightly tighter padding inside bubble for calendar */
.msg.bot.cal2-bubble{padding:10px 10px;}


/* Telegram Menu Styles */
.cmd-popup-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: transparent;
  z-index: 1000;
}
.cmd-popup-overlay.active { display: block; }

.cmd-popup-menu {
  position: absolute;
  bottom: 65px;
  left: 10px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  padding: 6px 0;
  min-width: 240px;
  max-width: 300px;
  max-height: 350px;
  overflow-y: auto;
  z-index: 1001;
  opacity: 0;
  transform: translateY(10px) scale(0.95);
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform-origin: bottom left;
}

.cmd-popup-menu.active {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.cmd-popup-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  font-size: 15px;
  color: #222;
  cursor: pointer;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  transition: background 0.2s;
  justify-content: flex-start;
  gap: 12px;
}
.cmd-popup-item:last-child {
  border-bottom: none;
}
.cmd-popup-item:active {
  background: #f0f0f0;
}
.cmd-popup-command {
  color: #888;
  font-size: 13px;
  margin-left: auto;
}

.input-area {
  display: flex;
  padding: 8px 10px;
  background: #fff;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  border-top: 1px solid #e1e4e8;
  position: relative;
  z-index: 1002;
}

.cmd-menu-btn {
  background: #5594d1;
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s;
}
.cmd-menu-btn:not(.active) {
  background: #f0f4f8;
  color: #5594d1;
}

.cmd-icon-close { display: none; }
.cmd-menu-btn.active .cmd-icon-open { display: none; }
.cmd-menu-btn.active .cmd-icon-close { display: inline; }

.input-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  background: #f0f4f8;
  border-radius: 20px;
  padding: 0 12px;
  position: relative;
}

.clip-btn, .emoji-btn {
  background: none;
  border: none;
  font-size: 20px;
  color: #888;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.msg-input {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px 8px;
  font-size: 15px;
  outline: none;
  width: 100%;
}

.mic-btn {
  background: none;
  border: none;
  font-size: 22px;
  color: #5594d1;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}
.mic-btn.send-mode {
  color: #fff;
  background: #5594d1;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 16px;
}

</style>
</head>
<body>
<div class="phone">
  <div class="tg-header">
    <div class="bot-avatar">🤖</div>
    <div class="bot-info"><h3>FitnessBot</h3><span>онлайн</span></div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="reply-kb" id="replyKb"></div>
  
  <!-- Popup overlay and menu -->
  <div class="cmd-popup-overlay" id="cmdPopupOverlay"></div>
  <div class="cmd-popup-menu" id="cmdPopupMenu">
    <!-- Menu items will be injected here by JS -->
  </div>

  <div class="input-area">
    <button class="cmd-menu-btn" id="cmdMenuBtn">
      <span class="cmd-icon-open">☰</span>
      <span class="cmd-icon-close">✕</span>
      Меню
    </button>
    <div class="input-wrapper">
      <button class="clip-btn">📎</button>
      <input class="msg-input" id="msgInput" placeholder="Сообщение..." />
      <button class="emoji-btn">⌨️</button>
    </div>
    <button class="mic-btn" id="sendBtn">🎙️</button>
  </div>
</div>
<script>
const chat=document.getElementById("chat"),replyKb=document.getElementById("replyKb"),msgInput=document.getElementById("msgInput"),sendBtn=document.getElementById("sendBtn");
const cmdMenuBtn=document.getElementById("cmdMenuBtn"),cmdPopupMenu=document.getElementById("cmdPopupMenu"),cmdPopupOverlay=document.getElementById("cmdPopupOverlay");

// Menu configuration
const MENU_ITEMS = [
  { text: "📅 Программы", cmd: "/programs" },
  { text: "🍎 Питание", cmd: "/nutrition" },
  { text: "📅 Календарь", cmd: "/calendar" },
  { text: "🛠 Органайзер", cmd: "/organizer" },
  { text: "👤 Профиль", cmd: "/profile" },
];

function initMenu() {
  MENU_ITEMS.forEach(item => {
    let div = document.createElement("div");
    div.className = "cmd-popup-item";

    let spanText = document.createElement("span");
    spanText.innerText = item.text;

    let spanCmd = document.createElement("span");
    spanCmd.className = "cmd-popup-command";
    spanCmd.innerText = item.cmd;

    div.appendChild(spanText);
    div.appendChild(spanCmd);

    div.onclick = () => {
      toggleMenu(false);
      {
        addMsg(item.text, "user");
        handleText(item.text);
      }
    };
    cmdPopupMenu.appendChild(div);
  });
}
initMenu();

function toggleMenu(forceState) {
  let isActive = forceState !== undefined ? forceState : !cmdMenuBtn.classList.contains("active");
  if(isActive) {
    cmdMenuBtn.classList.add("active");
    cmdPopupMenu.classList.add("active");
    cmdPopupOverlay.classList.add("active");
  } else {
    cmdMenuBtn.classList.remove("active");
    cmdPopupMenu.classList.remove("active");
    cmdPopupOverlay.classList.remove("active");
  }
}

cmdMenuBtn.addEventListener("click", () => toggleMenu());
cmdPopupOverlay.addEventListener("click", () => toggleMenu(false));

// Update microphone icon to send arrow when typing
msgInput.addEventListener("input", () => {
  if(msgInput.value.trim().length > 0) {
    sendBtn.classList.add("send-mode");
    sendBtn.innerText = "➤";
  } else {
    sendBtn.classList.remove("send-mode");
    sendBtn.innerText = "🎙️";
  }
});

const STORAGE_KEY="fitnessbot_v4";
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({userData,state,onboardStep,weightHistory,workoutLog,foodHistory,exerciseHistory,plan,waterHistory,calendarMarks}))}catch(e){}}
function loadData(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function clearData(){localStorage.removeItem(STORAGE_KEY)}

let foodHistory={},exerciseHistory={},plan={},waterHistory={};
let calendarMarks={};
let timerInterval=null,timerRemaining=0,timerTotal=0,timerNumEl=null,timerFillEl=null;

const EXERCISES={

function scrollDown(){setTimeout(()=>{chat.scrollTop=chat.scrollHeight},50)}
function addMsg(text,type="bot"){const d=document.createElement("div");d.className="msg "+type;d.textContent=text;chat.appendChild(d);scrollDown()}
function addInlineKb(buttons){const wrap=document.createElement("div");wrap.className="inline-kb";const rows=Array.isArray(buttons[0])?buttons:buttons.map(b=>[b]);rows.forEach(row=>{const rd=document.createElement("div");rd.className="inline-row";row.forEach(btn=>{const b=document.createElement("button");b.className="inline-btn";b.textContent=btn.text;b.onclick=()=>handleCallback(btn.cb,btn.text);rd.appendChild(b)});wrap.appendChild(rd)});chat.appendChild(wrap);scrollDown()}
function setReplyKb(buttons){
  replyKb.innerHTML="";
  if(!buttons||!buttons.length){
    replyKb.style.display="none";
    return;
  }
  replyKb.style.display="flex";
  buttons.flat().forEach(text=>{
    const b=document.createElement("button");
    b.className="reply-btn";
    b.textContent=text;
    b.onclick=()=>{addMsg(text,"user");handleText(text)};
    replyKb.appendChild(b);
  });
}
function showTyping(ms=700){return new Promise(res=>{const t=document.createElement("div");t.className="typing";t.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.appendChild(t);scrollDown();setTimeout(()=>{chat.removeChild(t);res()},ms)})}
async function botSay(text,delay=700){await showTyping(delay);addMsg(text)}
function todayStr(){return new Date().toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})}
function replaceLastInlineKb(buttons){const kbs=chat.querySelectorAll(".inline-kb");if(!kbs.length)return;const wrap=kbs[kbs.length-1];wrap.innerHTML="";const rows=Array.isArray(buttons[0])?buttons:buttons.map(b=>[b]);rows.forEach(row=>{const rd=document.createElement("div");rd.className="inline-row";row.forEach(btn=>{const b=document.createElement("button");b.className="inline-btn";b.textContent=btn.text;b.onclick=()=>handleCallback(btn.cb,btn.text);rd.appendChild(b)});wrap.appendChild(rd)});}

function startRestTimer(seconds){
if(timerInterval){clearInterval(timerInterval);timerInterval=null}
timerRemaining=seconds;timerTotal=seconds;
const wrap=document.createElement("div");wrap.className="timer-wrap";
wrap.innerHTML=`<div class="timer-label">⏱ Отдых между подходами</div><div class="timer-display" id="tn">${seconds}</div><div class="timer-bar"><div class="timer-fill" id="tf" style="width:100%"></div></div><div class="timer-btns"><button class="t-stop" id="ts">■ Стоп</button><button class="t-add" id="ta">+30с</button><button class="t-restart" id="tr">↻ Заново</button></div>`;
chat.appendChild(wrap);scrollDown();
timerNumEl=wrap.querySelector("#tn");timerFillEl=wrap.querySelector("#tf");
function tick(){timerRemaining--;if(timerRemaining<0){clearInterval(timerInterval);timerInterval=null;timerNumEl.textContent="✅";timerNumEl.style.color="#27ae60";timerFillEl.style.width="0%";try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}return}timerNumEl.textContent=timerRemaining;timerFillEl.style.width=Math.round(timerRemaining/timerTotal*100)+"%"}
timerInterval=setInterval(tick,1000);
wrap.querySelector("#ts").onclick=()=>{if(timerInterval){clearInterval(timerInterval);timerInterval=null}timerNumEl.textContent="⏸";timerNumEl.style.color="#888"};
wrap.querySelector("#ta").onclick=()=>{timerRemaining+=30;timerTotal=Math.max(timerTotal,timerRemaining);if(!timerInterval)timerInterval=setInterval(tick,1000);timerNumEl.textContent=timerRemaining;timerNumEl.style.color="#2aabee";timerFillEl.style.width=Math.round(timerRemaining/timerTotal*100)+"%"};
wrap.querySelector("#tr").onclick=()=>{if(timerInterval)clearInterval(timerInterval);timerRemaining=timerTotal;timerNumEl.textContent=timerRemaining;timerNumEl.style.color="#2aabee";timerFillEl.style.width="100%";timerInterval=setInterval(tick,1000)};
}

function drawWeightChart(){
if(weightHistory.length<2)return;
const wrap=document.createElement("div");wrap.className="chart-wrap";
const canvas=document.createElement("canvas");canvas.width=300;canvas.height=160;
wrap.appendChild(canvas);chat.appendChild(wrap);scrollDown();
const ctx=canvas.getContext("2d");const data=weightHistory.slice(-15);
const weights=data.map(d=>d.weight);const minW=Math.min(...weights)-1;const maxW=Math.max(...weights)+1;const range=maxW-minW||1;
const padL=40,padR=10,padT=15,padB=30,w=canvas.width,h=canvas.height,plotW=w-padL-padR,plotH=h-padT-padB;
ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
ctx.strokeStyle="#eee";ctx.lineWidth=1;const steps=4;
for(let i=0;i<=steps;i++){const y=padT+plotH*(1-i/steps);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();ctx.fillStyle="#999";ctx.font="10px sans-serif";ctx.textAlign="right";ctx.fillText((minW+range*i/steps).toFixed(1),padL-4,y+3)}
ctx.strokeStyle="#2aabee";ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.beginPath();
data.forEach((d,i)=>{const x=padL+plotW*i/(data.length-1);const y=padT+plotH*(1-(d.weight-minW)/range);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();
data.forEach((d,i)=>{const x=padL+plotW*i/(data.length-1);const y=padT+plotH*(1-(d.weight-minW)/range);ctx.fillStyle="#2aabee";ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()});
ctx.fillStyle="#999";ctx.font="9px sans-serif";ctx.textAlign="center";
const labelStep=Math.max(1,Math.floor(data.length/5));
data.forEach((d,i)=>{if(i%labelStep===0||i===data.length-1){const x=padL+plotW*i/(data.length-1);ctx.fillText(d.date.slice(0,5),x,h-5)}});
ctx.fillStyle="#333";ctx.font="bold 11px sans-serif";ctx.textAlign="left";ctx.fillText("📈 Динамика веса (кг)",padL,11);
}

async function startOnboarding(){onboardStep=0;state="onboarding";await botSay("👋 Привет! Я твой фитнес-помощник.\n\nДавай заполним профиль — 1 минута!");askOnboardStep()}
async function askOnboardStep(){const q=onboardQuestions[onboardStep];if(!q)return;await showTyping(500);addMsg(q.q);setReplyKb(q.kb||[])}
async function handleOnboard(text){
const q=onboardQuestions[onboardStep];if(!q)return;let val=text.trim();
if(q.field==="age"){const n=parseInt(val);if(isNaN(n)){await botSay("Введи число, например: 25");return}val=n}
if(q.field==="height"){const n=parseInt(val);if(isNaN(n)){await botSay("Введи число, например: 178");return}val=n}
if(q.field==="weight"){const n=parseFloat(val.replace(",","."));if(isNaN(n)){await botSay("Введи число, например: 75.5");return}val=n}
userData[q.field]=val;onboardStep++;saveData();
if(onboardStep>=onboardQuestions.length)await finishOnboarding();else await askOnboardStep();
}
async function finishOnboarding(){
state="main";if(userData.weight)weightHistory.push({date:todayStr(),weight:userData.weight});saveData();
await showTyping(800);
addMsg("✅ Профиль сохранён!\n\n👤 "+userData.name+" | "+userData.gender+"\n📏 "+userData.height+" см | ⚖️ "+userData.weight+" кг\n🎯 "+userData.goal+"\n🏅 "+userData.level+"\n\nВыбирай раздел!");
setReplyKb(MAIN_KB);
}

function calcKbzhu(){
const w=userData.weight||75,h=userData.height||175,age=userData.age||25,gender=userData.gender||"",goal=userData.goal||"";
let bmr=gender.includes("Муж")?10*w+6.25*h-5*age+5:10*w+6.25*h-5*age-161;
let tdee=Math.round(bmr*1.55);let kcal,protein,fat;
if(goal.includes("Похуд")){kcal=tdee-400;protein=Math.round(w*1.8);fat=Math.round(w*0.9)}
else if(goal.includes("Набр")){kcal=tdee+350;protein=Math.round(w*2);fat=Math.round(w*1)}
else{kcal=tdee;protein=Math.round(w*1.6);fat=Math.round(w*1)}
return{kcal,protein,fat,carbs:Math.round((kcal-protein*4-fat*9)/4)};
}

async function handleText(text){
if(state==="onboarding"){await handleOnboard(text);return}
if(text==="🏠 Главное меню"){state="main";await botSay("Главное меню:");setReplyKb(MAIN_KB);return}
if(text==="✅ Готово"){state="main";await botSay("Дневник питания сохранён 💾");setReplyKb(MAIN_KB);return}
if(state==="waiting_weight"){const w=parseFloat(text.replace(",","."));if(isNaN(w)){await botSay("Введи число, например: 74.5");return}userData.weight=w;weightHistory.push({date:todayStr(),weight:w});state="main";saveData();await botSay("✅ Вес обновлён: "+w+" кг\n📈 Записей: "+weightHistory.length);setReplyKb(MAIN_KB);return;}
if(state==="waiting_water"){const amt=parseInt(text.trim());if(isNaN(amt)||amt<=0){await botSay("Введи число (мл), например: 150");return}const today=todayStr();waterHistory[today]=(waterHistory[today]||0)+amt;saveData();state="main";await botSay("✅ Добавлено: +"+amt+" мл");await showWaterTracker();return;}
if(state==="food_log"){const parts=text.trim().split(" ");const kcal=parseInt(parts[parts.length-1]);if(!isNaN(kcal)&&parts.length>1){const name=parts.slice(0,-1).join(" ");const today=todayStr();if(!foodHistory[today])foodHistory[today]=[];foodHistory[today].push({name,kcal});saveData();const total=foodHistory[today].reduce((s,x)=>s+x.kcal,0);const norm=userData.weight?calcKbzhu().kcal:2000;const left=norm-total;await botSay("✅ Записано: "+name+" — "+kcal+" ккал\n\n📊 Сегодня: "+total+" ккал\n🎯 Норма: "+norm+" ккал\n"+(left>0?"💚 Осталось: "+left+" ккал":"🔴 Превышено на "+Math.abs(left)+" ккал")+"\n\nДобавить ещё? Введи «Название продукта и калории» или нажми «Готово»");setReplyKb([["✅ Готово"]]);}else{await botSay("Введи в формате:\nКурица 250\nОвсянка 300");}return;}

if(state==="warmup_calc"){
  const w = parseFloat(text.replace(",", "."));
  if(isNaN(w) || w <= 0){
    await botSay("Введи корректный вес, например: 80");
    return;
  }
  // Formula: Empty bar -> 40% -> 60% -> 80%
  // Assuming empty bar is 20kg.
  let msg = `🧮 Разминка для рабочего веса ${w} кг:\n\n`;
  if(w <= 20) {
    msg += "С таким весом можно использовать легкие гантели или разминаться без веса.";
  } else {
    msg += `1️⃣ Пустой гриф (20 кг) × 12-15 повт\n`;
    msg += `2️⃣ ${Math.max(20, Math.round(w*0.4/2.5)*2.5)} кг × 8-10 повт (40%)\n`;
    msg += `3️⃣ ${Math.max(20, Math.round(w*0.6/2.5)*2.5)} кг × 4-6 повт (60%)\n`;
    msg += `4️⃣ ${Math.max(20, Math.round(w*0.8/2.5)*2.5)} кг × 1-2 повт (80%)\n\n`;
    msg += "💪 Теперь рабочий вес!";
  }

  await botSay(msg);
  state="main";
  setReplyKb(MAIN_KB);
  return;
}
if(state==="log_set"){
  let textClean = text.trim().replace(/,/g, ' ').replace(/\s+/g, ' ');
  let nums = textClean.replace(/[xх×\*]/gi, ' ').replace(/\s+/g, ' ').split(' ');

  let validSets = [];
  for(let i=0; i<nums.length-1; i+=2){
    const w = parseFloat(nums[i]);
    const r = parseInt(nums[i+1]);
    if(!isNaN(w) && !isNaN(r)){
      validSets.push({w, r});
    }
  }

  if(validSets.length > 0){
    const {mgKey,catKey,exIdx}=userData._pendingEx||{};
    if(mgKey&&catKey&&exIdx!==undefined){
      const cat=EXERCISES[mgKey]?.cats[catKey];
      const ex=cat?.list[exIdx];
      if(ex){
        const key=ex.name;
        if(!exerciseHistory[key]) exerciseHistory[key]=[];

        validSets.forEach(s => {
          exerciseHistory[key].push({date:todayStr(), weight:s.w, reps:s.r});
        });

        saveData();
        state="main";
        const best=exerciseHistory[key].reduce((b,s)=>s.weight>b.weight?s:b,exerciseHistory[key][0]);

        let setsMsg = validSets.map((s, idx) => `Подход ${idx+1}: ${s.w} кг × ${s.r}`).join("\n");
        if(validSets.length === 1) setsMsg = `📦 ${validSets[0].w} кг × ${validSets[0].r} повт`;

        await botSay("✅ Подход(ы) записаны!\n💪 " + ex.name + "\n" + setsMsg + "\n\n🏆 Рекорд: " + best.weight + " кг × " + best.reps + " повт");

        addInlineKb([
          [{text:"➕ Ещё подход",cb:"logset_"+mgKey+"_"+catKey+"_"+exIdx}],
          [{text:"🔙 К упражнению",cb:"ex_"+mgKey+"_"+catKey+"_"+exIdx}]
        ]);
        setReplyKb(MAIN_KB);
        return;
      }
    }
  }
  await botSay("Введи формат:\n80 10 (вес × повторений)\n\nМожно сразу несколько:\n45 12, 45 10, 38 12");
  addInlineKb([[{text:"❌ Отменить",cb:"cancel_logset"}]]);
  return;
}

async function showProgramDay(key,dayIdx){
  const prog=PROGRAMS[key];
  if(!prog)return;
  const day=prog.days[dayIdx];
  if(!day)return;

  await showTyping(500);
  let text=prog.name+" — "+day.name+"\n\n";
  const rows=[];
  const tStr = todayStr();

  day.exercises.forEach((e,i)=>{
    const ex = EXERCISES[e.mgKey]?.cats[e.catKey]?.list[e.exIdx];
    if(ex){
      text += (i+1)+". "+ex.name+" — "+ex.sets+"\n";

      // Ищем историю подходов
      const hist = exerciseHistory[ex.name] || [];
      if(hist.length > 0){
        // Группируем по датам
        const byDate = {};
        hist.forEach(s => {
          if(!byDate[s.date]) byDate[s.date] = [];
          byDate[s.date].push(s.weight+"×"+s.reps);
        });

        const dates = Object.keys(byDate);

        // Сегодняшние подходы
        if(byDate[tStr]){
           text += "   ✅ Сегодня: " + byDate[tStr].join(", ") + "\n";
        }

        // Предыдущая тренировка (последняя дата, которая не сегодня)
        const pastDates = dates.filter(d => d !== tStr);
        if(pastDates.length > 0){
           const lastDate = pastDates[pastDates.length - 1]; // Самая последняя тренировка
           text += "   🕒 Прошлый раз ("+lastDate.slice(0,5)+"): " + byDate[lastDate].join(", ") + "\n";
        }
      }

      text += "\n"; // пустая строка между упражнениями
      rows.push([{text:(i+1)+". "+ex.name,cb:"ex_"+e.mgKey+"_"+e.catKey+"_"+e.exIdx}]);
    }
  });

  addMsg(text.trim());
  rows.push([{text:"✅ Засчитать тренировку",cb:"done_"+key}]);
  rows.push([{text:"🔙 К программам",cb:"prog_"+key}]);
  addInlineKb(rows);
  setReplyKb(BACK_KB);
}

// ====== Calendar v2 + manual marks helpers ======
const CAL2_MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const CAL2_DOW = ["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
function cal2Pad2(n){return String(n).padStart(2,'0');}
function cal2MonthTitle(year, month){
  const m = CAL2_MONTHS[month] || '';
  return (m.charAt(0).toUpperCase()+m.slice(1)) + ' ' + year;
}
function cal2IsoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function cal2BuildMonthIndex(year, month){
  const autoDays = new Set();
  const manualDays = new Set();
  const byDay = {};

  (workoutLog || []).forEach(w => {
    const parts = (w.date || '').split('.');
    if(parts.length !== 3) return;
    const d = parseInt(parts[0],10);
    const m = parseInt(parts[1],10) - 1;
    const y = parseInt(parts[2],10);
    if(y === year && m === month && d > 0){
      autoDays.add(d);
      byDay[d] = byDay[d] || {auto:[], manual:false};
      byDay[d].auto.push(w.program || 'Тренировка');
    }
  });

  const marks = calendarMarks || {};
  Object.keys(marks).forEach(ds => {
    const parts = ds.split('.');
    if(parts.length !== 3) return;
    const d = parseInt(parts[0],10);
    const m = parseInt(parts[1],10) - 1;
    const y = parseInt(parts[2],10);
    if(y === year && m === month && d > 0){
      manualDays.add(d);
      byDay[d] = byDay[d] || {auto:[], manual:false};
      byDay[d].manual = true;
    }
  });

  const allDays = new Set([...autoDays, ...manualDays]);
  return {allDays, autoDays, manualDays, byDay};
}
function cal2MakeCell(text, className){
  const el = document.createElement('div');
  el.className = className;
  el.textContent = text;
  return el;
}
function cal2RenderInto(wrap, year, month, selectedDay=null){
  const now = new Date();
  const isThisMonth = (now.getFullYear() === year && now.getMonth() === month);
  const today = now.getDate();

  const {allDays, autoDays, manualDays, byDay} = cal2BuildMonthIndex(year, month);

  const first = new Date(year, month, 1);
  const firstDow = (first.getDay() + 6) % 7; // Mon=0..Sun=6
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const totalCells = firstDow + daysInMonth;
  const weeks = Math.ceil(totalCells / 7);

  wrap.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'cal2-header';
  header.innerHTML = `
    <button class="cal2-nav" type="button" data-delta="-1">‹</button>
    <div class="cal2-title">${cal2MonthTitle(year, month)}</div>
    <button class="cal2-nav" type="button" data-delta="1">›</button>
  `;

  const grid = document.createElement('div');
  grid.className = 'cal2-grid';

  grid.appendChild(cal2MakeCell('#','cal2-h'));
  CAL2_DOW.forEach((d,i)=> grid.appendChild(cal2MakeCell(d, 'cal2-h' + (i>=5?' cal2-weekend':''))));

  const details = document.createElement('div');
  details.className = 'cal2-details';
  details.textContent = 'Нажмите на день, чтобы увидеть детали и запланировать тренировку.';

  const actionBtn = document.createElement('button');
  actionBtn.type = 'button';
  actionBtn.className = 'inline-btn';
  actionBtn.style.width = '100%';
  actionBtn.style.marginTop = '8px';
  actionBtn.textContent = '📅 Запланировать тренировку';
  actionBtn.disabled = true;

  function setDetailsForDay(dnum){
    if(!dnum || dnum < 1 || dnum > daysInMonth){
      details.textContent = 'Нажмите на день, чтобы увидеть детали и запланировать тренировку.';
      actionBtn.textContent = '📅 Запланировать тренировку';
      actionBtn.disabled = true;
      return;
    }

    const ds = `${cal2Pad2(dnum)}.${cal2Pad2(month+1)}.${year}`;
    const info = byDay[dnum] || {auto:[], manual:false};
    const isManual = !!info.manual;
    const isAuto = (info.auto || []).length > 0;
    const plannedName = calendarMarks && calendarMarks[ds] && calendarMarks[ds] !== true
      ? calendarMarks[ds] : null;

    let text = `${ds}\n`;
    if(isAuto){
      text += '✅ ' + (info.auto || []).join(', ') + '\n';
    }
    if(plannedName){
      text += '📌 Запланировано: ' + plannedName + '\n';
    } else if(isManual){
      text += '📌 Запланировано (без названия)\n';
    }
    if(!isAuto && !isManual){
      text += '😴 Тренировок нет';
    }
    details.textContent = text.trim();

    actionBtn.disabled = false;

    if(isManual){
      actionBtn.textContent = '🗑 Снять запланированную тренировку';
      actionBtn.style.background = '#ff5555';
      actionBtn.style.color = '#fff';
      actionBtn.onclick = () => {
        if(!calendarMarks) calendarMarks = {};
        delete calendarMarks[ds];
        saveData();
        const old = wrap.querySelector('.cal-picker');
        if(old) old.remove();
        cal2RenderInto(wrap, year, month, dnum);
      };
    } else {
      actionBtn.textContent = '📅 Запланировать тренировку';
      actionBtn.style.background = '';
      actionBtn.style.color = '';
      actionBtn.onclick = () => {
        const old = wrap.querySelector('.cal-picker');
        if(old){ old.remove(); return; }

        const picker = document.createElement('div');
        picker.className = 'cal-picker';
        picker.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;';

        const progOptions = Object.keys(PROGRAMS).map(k => ({ name: PROGRAMS[k].name, key: k }));
        const extraOptions = [
          { name: '🏃 Кардио' },
          { name: '🧘 Растяжка' },
          { name: '🏋️ Своя тренировка' }
        ];

        [...progOptions.map(o => o.name), ...extraOptions.map(o => o.name)].forEach(name => {
          const b = document.createElement('button');
          b.className = 'inline-btn';
          b.textContent = name;
          b.style.flex = '1 1 calc(50% - 6px)';
          b.onclick = () => {
            if(!calendarMarks) calendarMarks = {};
            calendarMarks[ds] = name;
            saveData();
            picker.remove();
            cal2RenderInto(wrap, year, month, dnum);
          };
          picker.appendChild(b);
        });

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'inline-btn';
        cancelBtn.textContent = '✕ Отмена';
        cancelBtn.style.cssText = 'width:100%;background:#eee;color:#333;margin-top:2px;';
        cancelBtn.onclick = () => picker.remove();
        picker.appendChild(cancelBtn);

        actionBtn.after(picker);
      };
    }
  }

  for(let w=0; w<weeks; w++){
    const rowStart = new Date(year, month, 1 + (w*7 - firstDow));
    grid.appendChild(cal2MakeCell(String(cal2IsoWeek(rowStart)), 'cal2-weeknum'));

    for(let i=0;i<7;i++){
      const cellIndex = w*7 + i;
      const dnum = cellIndex - firstDow + 1;

      const cell = document.createElement('div');
      cell.className = 'cal2-cell';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cal2-daybtn';

      if(dnum < 1 || dnum > daysInMonth){
        btn.classList.add('cal2-daybtn--empty');
        btn.textContent = '';
        btn.disabled = true;
      } else {
        const isWeekend = (i >= 5);
        if(isWeekend) btn.classList.add('cal2-daybtn--weekend');

        const isAuto = autoDays.has(dnum);
        const isManual = manualDays.has(dnum);
        if(isAuto) btn.classList.add('cal2-daybtn--workout');
        else if(isManual) btn.classList.add('cal2-daybtn--manual');

        if(isThisMonth && dnum === today) btn.classList.add('cal2-daybtn--today');

        // Show planned workout name under day number
        const ds2 = `${cal2Pad2(dnum)}.${cal2Pad2(month+1)}.${year}`;
        const plannedVal = calendarMarks && calendarMarks[ds2] && calendarMarks[ds2] !== true
          ? calendarMarks[ds2] : null;

        if(isManual && plannedVal){
          btn.style.cssText = 'font-size:9px;line-height:1.2;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;';
          const numSpan = document.createElement('span');
          numSpan.style.cssText = 'font-size:13px;font-weight:700;';
          numSpan.textContent = String(dnum);
          const nameSpan = document.createElement('span');
          nameSpan.style.cssText = 'font-size:8px;font-weight:600;max-width:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
          // shorten name: strip emoji prefix if any
          const shortName = plannedVal.replace(/^[^\wЀ-ӿ]+/,'').slice(0,6);
          nameSpan.textContent = shortName;
          btn.appendChild(numSpan);
          btn.appendChild(nameSpan);
        } else {
          btn.textContent = String(dnum);
        }

        btn.onclick = () => {
          selectedDay = dnum;
          setDetailsForDay(dnum);
        };
      }

      cell.appendChild(btn);
      grid.appendChild(cell);
    }
  }

  const legend = document.createElement('div');
  legend.className = 'cal2-legend';
  legend.innerHTML = `
    <span class="cal2-pill"><span class="cal2-dot cal2-dot--workout"></span> тренировка</span>
    <span class="cal2-pill"><span class="cal2-dot cal2-dot--manual"></span> запланировано</span>
    <span class="cal2-pill"><span class="cal2-dot cal2-dot--today"></span> сегодня</span>
    <span class="cal2-pill"><span class="cal2-dot cal2-dot--weekend"></span> выходные</span>
  `;

  const autoCount = autoDays.size;
  const manualOnlyCount = [...manualDays].filter(d => !autoDays.has(d)).length;
  const allCount = allDays.size;

  const count = document.createElement('div');
  count.className = 'cal2-count';
  count.innerHTML = `В этом месяце: <b>${allCount}</b> дней (${autoCount} завершено, ${manualOnlyCount} запланировано)`;

  const note = document.createElement('div');
  note.className = 'cal2-note';
  note.textContent = 'Ручные отметки влияют только на календарь и не меняют счётчик тренировок в профиле/достижениях.';

  wrap.appendChild(header);
  wrap.appendChild(grid);
  wrap.appendChild(legend);
  wrap.appendChild(count);
  wrap.appendChild(details);
  wrap.appendChild(actionBtn);
  wrap.appendChild(note);

  header.querySelectorAll('.cal2-nav').forEach(b => {
    b.onclick = () => {
      const delta = parseInt(b.dataset.delta, 10);
      let nm = month + delta;
      let ny = year;
      if(nm < 0){nm = 11; ny--;}
      if(nm > 11){nm = 0; ny++;}
      cal2RenderInto(wrap, ny, nm, null);
    };
  });

  if(selectedDay) setDetailsForDay(selectedDay);
}

async function showWaterTracker(){await showTyping(400);const today=todayStr();const current=waterHistory[today]||0;const goal=userData.weight?Math.round(userData.weight*30):2000;const percent=Math.min(100,Math.round((current/goal)*100));let text="💧 Трекер воды — "+today+"\n\nВыпито: "+current+" мл из "+goal+" мл\n";const filled=Math.round(percent/10);const empty=10-filled;text+="["+"🟦".repeat(filled)+"⬜".repeat(empty)+"] "+percent+"%\n\n";text+=current>=goal?"✅ Дневная норма выполнена!":"Осталось: "+(goal-current)+" мл";addMsg(text);addInlineKb([[{text:"+250 мл 🥤",cb:"water_add_250"},{text:"✍️ Свой объём",cb:"water_custom"}],[{text:"↩️ Сбросить день",cb:"water_reset"}]]);setReplyKb(BACK_KB);}
async function showGuideMenu(){await showTyping(400);addMsg("📚 Справочник\n\nВыбери группу мышц:");const rows=[];const keys=Object.keys(GUIDE_DB);for(let i=0;i<keys.length;i+=2){const row=[];row.push({text:GUIDE_DB[keys[i]].title,cb:"guide_cat_"+keys[i]});if(keys[i+1])row.push({text:GUIDE_DB[keys[i+1]].title,cb:"guide_cat_"+keys[i+1]});rows.push(row);}addInlineKb(rows);setReplyKb(BACK_KB);}
async function showGuideCategory(catKey){await showTyping(300);const cat=GUIDE_DB[catKey];if(!cat)return;addMsg("Раздел: "+cat.title+"\nВыбери упражнение:");const rows=[];const artKeys=Object.keys(cat.articles);if(artKeys.length===0){rows.push([{text:"⏳ Статьи в разработке",cb:"guide_main"}]);}else{artKeys.forEach(k=>{rows.push([{text:"📖 "+cat.articles[k].title,cb:"gART|"+catKey+"|"+k}]);});}rows.push([{text:"🔙 Назад",cb:"guide_main"}]);addInlineKb(rows);}
async function showGuideArticle(catKey,artKey){await showTyping(600);const cat=GUIDE_DB[catKey];if(!cat||!cat.articles[artKey])return;addMsg(cat.articles[artKey].text);addInlineKb([[{text:"🔙 К списку",cb:"guide_cat_"+catKey},{text:"📚 Справочник",cb:"guide_main"}]]);}
// =================== ПРОФИЛЬ ===================
async function showProfile(){await showTyping(400);if(!userData.name){addMsg("Профиль не найден. Напиши /start");return}addMsg("👤 Профиль\n\nИмя: "+userData.name+"\nПол: "+userData.gender+"\nВозраст: "+userData.age+" лет\nРост: "+userData.height+" см\nВес: "+userData.weight+" кг\nЦель: "+userData.goal+"\nУровень: "+userData.level+"\n\n🏅 Тренировок: "+(userData.workouts||0));addInlineKb([
  [{text:"📊 Прогресс", cb:"open_progress"},{text:"🏆 Достижения", cb:"open_achievements"}],
  [{text:"📚 Справочник", cb:"guide_main"},{text:"💬 Поддержка", cb:"open_support"}],
  [{text:"🗑️ Сбросить данные", cb:"clear_all_data"}]
]);setReplyKb(BACK_KB)}



async function showSupport(){
  await showTyping(400);
  addMsg("💬 Поддержка\n\nНапиши, что не работает или какую функцию добавить.\n\n📩 Контакт: @your_username (замени на свой)\nили email: support@example.com", "bot");
  addInlineKb([[{text:"👤 В профиль", cb:"open_profile"}]]);
  setReplyKb(BACK_KB);
}
// =================== СТАРТ ===================
function sendMessage(){const text=msgInput.value.trim();if(!text)return;  msgInput.value="";
  sendBtn.classList.remove("send-mode");
  sendBtn.innerText = "🎙️";if(text==="/start"){clearData();
  userData={};
  weightHistory=[];
  workoutLog=[];
  foodHistory={};
  exerciseHistory={};
  plan={};
  waterHistory={};
  calendarMarks={};
  state="start";startOnboarding();return}addMsg(text,"user");handleText(text)}
sendBtn.addEventListener("click",sendMessage);
msgInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

(async()=>{
const saved=loadData();
if(saved&&saved.userData&&saved.userData.name){
userData=saved.userData;state=saved.state||"main";onboardStep=saved.onboardStep||0;
weightHistory=saved.weightHistory||[];workoutLog=saved.workoutLog||[];
foodHistory=saved.foodHistory||{};exerciseHistory=saved.exerciseHistory||{};plan=saved.plan||{};waterHistory=saved.waterHistory||{};
  calendarMarks=saved.calendarMarks||{};
await showTyping(600);
addMsg("👋 С возвращением, "+userData.name+"!\n\n🏅 Тренировок: "+(userData.workouts||0)+"\n⚖️ Вес: "+(userData.weight||"—")+" кг\n\nВыбирай раздел!");
setReplyKb(MAIN_KB);
}else{await showTyping(800);addMsg("💪 Добро пожаловать в FitnessBot!\n\nНапиши /start чтобы начать")}
})();
